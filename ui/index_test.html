<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestrian Test Harness</title>
    <link rel="stylesheet" href="css/session.css">
    <style>
        /* Test harness sidebar: sits in-flow to the right of the app so it
           never overlays lanes (a previous overlay cost real e2e debugging) */
        body { display: grid; grid-template-columns: minmax(0, 1fr) 240px; }
        #app { min-width: 0; overflow: hidden; }
        #test-controls {
            background: #201a15;
            border-left: 1px solid #322920;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
        }
        #test-controls h3 { margin: 0 0 10px; font-size: 13px; color: #e8a13c; }
        #test-controls .group-label {
            margin: 12px 0 6px;
            color: #93826d;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 10px;
        }
        #test-controls button {
            display: block;
            width: 100%;
            margin-bottom: 6px;
            padding: 8px;
            font-size: 12px;
        }
        #test-controls button.active { border-color: #e8a13c; color: #e8a13c; }
        #mock-status { margin-top: 12px; color: #93826d; font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
    </style>
</head>

<body>
    <div id="app">
        <!-- TRANSPORT -->
        <div id="transport">
            <span class="brand">CELESTRIAN · TEST</span>
            <button id="play-btn" title="Play / stop (space)">▶</button>
            <button id="record-btn" title="Record"></button>
            <span id="position-readout">—</span>
            <span id="q-info"></span>
            <span class="spacer"></span>
            <button id="add-stack-btn">+ New Stack</button>
        </div>

        <!-- SESSION -->
        <div id="session">
            <div id="grid-area">
                <div id="ruler-row">
                    <div class="rail-spacer"></div>
                    <div id="ruler"></div>
                </div>
                <div id="lanes"></div>
                <div id="playhead"></div>
            </div>
            <div id="empty-state">No takes yet — hit record, or + New Stack to build a kit.</div>
        </div>

        <!-- STATUS STRIP -->
        <div id="status-strip">
            <span id="log-line">ready</span>
            <span id="calibration-status"></span>
            <button id="calibrate-btn">🎯 Calibrate</button>
            <button id="dump-state-btn">📦 Dump State</button>
        </div>
    </div>

    <!-- TEST SCENARIO SIDEBAR -->
    <div id="test-controls">
        <h3>🧪 Test Scenarios</h3>
        <button onclick="loadScenario('empty')">Empty Canvas</button>
        <button onclick="loadScenario('single-clip')" class="active">Single Clip</button>
        <button onclick="loadScenario('stack-with-clips')">Stack with 3 Clips</button>
        <button onclick="loadScenario('multiple-stacks')">Multiple Stacks</button>
        <div class="group-label">Recording.md examples</div>
        <button onclick="loadScenario('example-1q-4q')">1Q + 4Q (LCM=4)</button>
        <button onclick="loadScenario('example-1q-4q-3q')">1Q + 4Q + 3Q (LCM=12)</button>
        <div class="group-label">Recording tests</div>
        <button onclick="loadScenario('recording-1q-plus-growing')">1Q + Recording</button>
        <button onclick="loadScenario('clip-3-anchor-at-2q')">1Q + 4Q + 1Q@2Q (Anchor)</button>
        <button onclick="loadScenario('1q-3q-loop-bug')">1Q + 3Q (Loop)</button>
        <div class="group-label">Nested stacks</div>
        <button onclick="loadScenario('nested-stacks')">Nested Stacks</button>
        <div id="mock-status">Using Mock Backend</div>
    </div>

    <!-- Load app with mock backend -->
    <script type="module">
        // Only mock_backend may be imported statically here: anything that
        // (transitively) imports backend.js would evaluate the facade BEFORE
        // window.celestrian is set below and select the JUCE-bridge path.
        // app.js is dynamically imported at the bottom for the same reason.
        import { callNative, log, getState, loadScenario as loadBackendScenario, setMasterPos, setIsPlaying } from './js/mock_backend.js';

        // Make loadScenario available globally for buttons
        window.loadScenario = function (name) {
            loadBackendScenario(name);
            document.querySelectorAll('#test-controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (window.event && window.event.target) window.event.target.classList.add('active');
        };

        // Inject mock backend into window and patch getGraphState
        window.celestrian = {
            callNative: async (method, ...args) => {
                if (method === 'getGraphState') {
                    return getState();
                }
                return callNative(method, ...args);
            },
            log,
            getState,
            setMasterPos,
            setIsPlaying
        };

        // Now load the main app (same file works for both test and production!)
        import('./js/app.js');
    </script>
</body>

</html>
