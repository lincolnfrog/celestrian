<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestrian</title>
    <link rel="icon" href="assets/celestrian-favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="assets/celestrian-favicon-32.png" type="image/png">
    <!-- Design fonts (dark tape theme handoff): Archivo for UI, IBM Plex
         Mono for readouts. Falls back to system stacks offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/session.css">
</head>

<body>
    <!-- LOADING OVERLAY — styled by css/session.css §21 (the stylesheet
         is a render-blocking link, so the splash paints exactly as the
         old inline styles did). app.js hides it once modules land. -->
    <div id="loading-overlay">
        <div class="loading-inner">
            <img src="assets/celestrian-mark.svg" alt="" width="64" height="64">
            <div class="loading-title">CELESTRIAN</div>
            <div id="loading-status">Loading modules...</div>
        </div>
    </div>

    <div id="app">
        <!-- TRANSPORT -->
        <div id="transport">
            <span class="brand"><img src="assets/celestrian-mark.svg" alt="" width="40"
                    height="40"><span class="brand-text">CELESTRIAN</span></span>
            <button id="play-btn" title="Play / stop (space)">▶</button>
            <!-- Odometer: position readout over the Q/rate sub-line -->
            <div id="odometer" title="Position — playhead over the audible cycle">
                <div class="digits" id="position-readout">—</div>
                <div class="sub" id="q-info"></div>
            </div>
            <!-- THE MASTER STRIP (B5): the root stack's output stage.
                 VU needles read the post-fader master (masterVuL/R on
                 the state poll — the device buffers after the root's
                 gain·pan and rack), each with a peak-hold tick and a
                 clip lamp that latches until the face is clicked; the
                 fader is the root's gain (setNodeGain on rootId); fx
                 opens the root's rack as the first row.
                 Keep in lockstep with index_test.html. -->
            <div id="master-monitor" title="Master output — what the speakers hear">
                <div class="vu-pair">
                    <div class="vu" id="vu-l">
                        <div class="label">VU · L</div>
                        <div class="arc"></div>
                        <div class="zone"></div>
                        <span class="peak"></span>
                        <div class="hold"></div>
                        <div class="needle"></div>
                    </div>
                    <div class="vu" id="vu-r">
                        <div class="label">VU · R</div>
                        <div class="arc"></div>
                        <div class="zone"></div>
                        <span class="peak"></span>
                        <div class="hold"></div>
                        <div class="needle"></div>
                    </div>
                    <button id="master-fader"
                        title="Master volume — drag up/down, double-click for unity"><span
                            class="grip"></span></button>
                    <button id="master-fx-btn" class="mono"
                        title="Master effects: the root's rack — EQ · Compressor · Echo · Reverb">fx</button>
                </div>
                <div class="monitor-label">MASTER MONITOR</div>
            </div>
            <span class="spacer"></span>
            <button id="zoom-out-btn" class="bar-btn" title="Zoom out (−)">−</button>
            <span id="zoom-level" title="Click to reset zoom">100%</span>
            <button id="zoom-in-btn" class="bar-btn" title="Zoom in (+)">＋</button>
            <button id="project-menu-btn" class="bar-btn"
                    title="Project — save, rename, templates">Project ▾</button>
            <div id="project-menu" class="mono"></div>
            <!-- PREFERENCES (tasks.md B8, preferences.js): the one
                 panel for the persisted per-machine choices — audio
                 device (audio_settings.js renders into the host),
                 latency calibration (app.js wires the button), the
                 projects root (chooseProjectsRoot). Static markup so
                 app.js binds the calibration ids at init.
                 Keep in lockstep with index_test.html. -->
            <button id="prefs-btn" class="bar-btn"
                    title="Preferences — audio device, latency, projects folder">⚙</button>
            <div id="prefs-panel" class="audio-panel">
                <div class="ap-head">Preferences</div>
                <div class="ap-section">
                    <div class="ap-label">Audio device</div>
                    <div id="audio-device-host"></div>
                </div>
                <div class="ap-section">
                    <div class="ap-label">Latency</div>
                    <div class="ap-row">
                        <button id="calibrate-btn"
                            title="Measure real round-trip latency: plays a click and listens for it on the input. See docs/performance.md">🎯
                            Calibrate</button>
                        <span id="calibration-status"></span>
                    </div>
                </div>
                <div class="ap-section">
                    <div class="ap-label">Projects folder</div>
                    <div class="ap-row">
                        <span id="projects-root" class="mono"></span>
                        <button id="projects-root-change"
                            title="Choose the folder your projects and track templates live under">Change…</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SESSION -->
        <div id="session">
            <div id="grid-area">
                <div id="ruler-row">
                    <div class="rail-spacer">
                        <!-- THE SEQUENCER (docs/sequencer.md): the
                             SESSION's own song — this is the root
                             stack's "rail", so its chip lives here,
                             above the track rails. Groups carry their
                             own seq chips on their rails (fractal). -->
                        <button id="root-seq-btn" class="mono"
                            title="Sequencer: arrange your tracks into a song (steps + gates)">seq</button>
                    </div>
                    <div id="ruler"></div>
                </div>
                <div id="lanes"></div>
                <div id="playhead"></div>
            </div>
            <!-- The BOOT state since Q17 (boot empty — the launch
                 ritual is retired): no message needed, the ＋ Track
                 row below is the whole story (owner call 2026-08-13:
                 "just having a + button is pretty clear"). The element
                 survives as the zero-lanes marker the shell toggles
                 and the e2e specs assert on. -->
            <div id="empty-state"></div>
            <!-- Keep in lockstep with index_test.html — the harness binds
                 the same IDs (initSessionView); see that file for the
                 2026-07-21 crash story when create-row landed only here. -->
            <div id="selection-bar" class="mono">
                <span class="sel-count"></span>
                <button class="sel-group">Group</button>
                <button class="sel-clear" title="Esc">Clear</button>
            </div>
            <div id="create-row">
                <button id="create-track-btn"
                        title="Add a track — drag one track onto another to group them">＋ Track</button>
            </div>
        </div>

        <!-- STATUS STRIP -->
        <div id="status-strip">
            <span id="ready-lamp" title="Engine ready"></span>
            <span id="log-line">ready</span>
            <button id="plugins-btn" class="bar-btn"
                title="VST3 plugins — the known-plugin registry and scan. See docs/vst3.md">🔌
                Plugins</button>
            <button id="dump-state-btn">📦 Dump State</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
