<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestrian</title>
    <link rel="icon" href="assets/celestrian-favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="assets/celestrian-favicon-32.png" type="image/png">
    <!-- Design fonts (dark tape theme handoff): Archivo for UI, IBM Plex
         Mono for readouts. Falls back to system stacks offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/session.css">
</head>

<body>
    <!-- LOADING OVERLAY — styled by css/session.css §21 (the stylesheet
         is a render-blocking link, so the splash paints exactly as the
         old inline styles did). app.js hides it once modules land. -->
    <div id="loading-overlay">
        <div class="loading-inner">
            <img src="assets/celestrian-mark.svg" alt="" width="64" height="64">
            <div class="loading-title">CELESTRIAN</div>
            <div id="loading-status">Loading modules...</div>
        </div>
    </div>

    <div id="app">
        <!-- TRANSPORT -->
        <div id="transport">
            <span class="brand"><img src="assets/celestrian-mark.svg" alt="" width="40"
                    height="40"><span class="brand-text">CELESTRIAN</span></span>
            <button id="play-btn" title="Play / stop (space)">▶</button>
            <!-- Odometer: position readout over the Q/rate sub-line -->
            <div id="odometer" title="Position — playhead over the audible cycle">
                <div class="digits" id="position-readout">—</div>
                <div class="sub" id="q-info"></div>
            </div>
            <!-- Master monitor: VU needles driven by the engine's master
                 output RMS (masterVuL/R on the state poll) -->
            <div id="master-monitor" title="Master output — what the speakers hear">
                <div class="vu-pair">
                    <div class="vu" id="vu-l">
                        <div class="label">VU · L</div>
                        <div class="arc"></div>
                        <div class="zone"></div>
                        <span class="peak"></span>
                        <div class="needle"></div>
                    </div>
                    <div class="vu" id="vu-r">
                        <div class="label">VU · R</div>
                        <div class="arc"></div>
                        <div class="zone"></div>
                        <span class="peak"></span>
                        <div class="needle"></div>
                    </div>
                    <button id="master-fader"
                        title="Master volume — drag up/down, double-click for unity"><span
                            class="grip"></span></button>
                </div>
                <div class="monitor-label">MASTER MONITOR</div>
            </div>
            <span class="spacer"></span>
            <button id="zoom-out-btn" class="bar-btn" title="Zoom out (E)">−</button>
            <span id="zoom-level" title="Click to reset zoom">100%</span>
            <button id="zoom-in-btn" class="bar-btn" title="Zoom in (Q)">＋</button>
            <button id="project-menu-btn" class="bar-btn"
                    title="Project — save, rename, templates">Project ▾</button>
            <div id="project-menu" class="mono"></div>
        </div>

        <!-- SESSION -->
        <div id="session">
            <div id="grid-area">
                <div id="ruler-row">
                    <div class="rail-spacer"></div>
                    <div id="ruler"></div>
                </div>
                <div id="lanes"></div>
                <div id="playhead"></div>
            </div>
            <!-- The BOOT state since Q17 (boot empty — the launch
                 ritual is retired): no message needed, the ＋ Track
                 row below is the whole story (owner call 2026-08-13:
                 "just having a + button is pretty clear"). The element
                 survives as the zero-lanes marker the shell toggles
                 and the e2e specs assert on. -->
            <div id="empty-state"></div>
            <!-- Keep in lockstep with index_test.html — the harness binds
                 the same IDs (initSessionView); see that file for the
                 2026-07-21 crash story when create-row landed only here. -->
            <div id="selection-bar" class="mono">
                <span class="sel-count"></span>
                <button class="sel-group">Group</button>
                <button class="sel-clear" title="Esc">Clear</button>
            </div>
            <div id="create-row">
                <button id="create-track-btn"
                        title="Add a track — drag one track onto another to group them">＋ Track</button>
            </div>
        </div>

        <!-- STATUS STRIP -->
        <div id="status-strip">
            <span id="ready-lamp" title="Engine ready"></span>
            <span id="log-line">ready</span>
            <span id="calibration-status"></span>
            <button id="audio-device-btn" class="bar-btn"
                title="Audio device — driver, interface, sample rate, buffer. On Windows only ASIO exposes all inputs of a multi-channel interface.">🎛
                Audio</button>
            <button id="calibrate-btn"
                title="Measure real round-trip latency: plays a click and listens for it on the input. See docs/performance.md">🎯
                Calibrate</button>
            <button id="dump-state-btn">📦 Dump State</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
