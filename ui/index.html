<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestrian</title>
    <link rel="stylesheet" href="css/session.css">
</head>

<body>
    <!-- LOADING OVERLAY -->
    <div id="loading-overlay"
        style="position:fixed;top:0;left:0;width:100%;height:100%;background:#171310;display:flex;justify-content:center;align-items:center;color:#e8a13c;z-index:9999;font-family:sans-serif;">
        <div style="text-align:center;">
            <div style="font-size:24px;font-weight:900;margin-bottom:10px;letter-spacing:0.2em;">CELESTRIAN</div>
            <div id="loading-status">Loading modules...</div>
        </div>
    </div>

    <div id="app">
        <!-- TRANSPORT -->
        <div id="transport">
            <span class="brand">CELESTRIAN</span>
            <button id="play-btn" title="Play / stop (space)">▶</button>
            <button id="record-btn" title="Record"></button>
            <span id="position-readout">—</span>
            <span class="spacer"></span>
            <span id="q-info"></span>
            <button id="project-menu-btn" class="bar-btn"
                    title="Project — save, rename, templates">Project ▾</button>
            <div id="project-menu" class="mono"></div>
        </div>

        <!-- SESSION -->
        <div id="session">
            <div id="grid-area">
                <div id="ruler-row">
                    <div class="rail-spacer"></div>
                    <div id="ruler"></div>
                </div>
                <div id="lanes"></div>
                <div id="playhead"></div>
            </div>
            <!-- Rarely seen: the app always boots into a template
                 (docs/projects.md launch ritual). Only reachable by
                 deleting every track. -->
            <div id="empty-state">Session cleared — ● records a fresh track.</div>
            <div id="create-row">
                <button id="create-track-btn"
                        title="A track records one instrument">＋ Track</button>
                <button id="create-group-btn"
                        title="A group mixes several tracks (e.g. five drum mics) and loops as one">＋ Group</button>
            </div>
        </div>

        <!-- STATUS STRIP -->
        <div id="status-strip">
            <span id="log-line">ready</span>
            <span id="calibration-status"></span>
            <button id="calibrate-btn"
                title="Measure real round-trip latency: plays a click and listens for it on the input. See docs/performance.md">🎯
                Calibrate</button>
            <button id="dump-state-btn">📦 Dump State</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
